name: DiffGuard PR review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Public pull request number to review"
        required: true
        type: number
      comment:
        description: "Create or update the evidence summary comment"
        required: true
        default: true
        type: boolean
      fail_on:
        description: "Optional risk threshold for a failing check"
        required: true
        default: "never"
        type: choice
        options: [never, critical, high, medium, low]

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

concurrency:
  group: diffguard-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require deployed DiffGuard URL
        shell: bash
        env:
          DIFFGUARD_URL: ${{ vars.DIFFGUARD_URL }}
        run: |
          if [[ -z "$DIFFGUARD_URL" ]]; then
            echo "::error::Set the repository variable DIFFGUARD_URL to the deployed HTTPS application URL."
            exit 1
          fi
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve reviewed pull request ref
        id: reviewed_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr_path="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          head_sha="$(gh api "$pr_path" --jq '.head.sha')"
          head_repository="$(gh api "$pr_path" --jq '.head.repo.full_name')"
          echo "ref=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_OUTPUT"
          echo "sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [[ "$head_repository" == "$GITHUB_REPOSITORY" ]]; then
            echo "sarif_supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SARIF upload is skipped for fork pull requests; annotations and the evidence artifact remain available."
          fi
      - name: Run evidence-first review
        id: diffguard
        uses: ./
        with:
          diffguard-url: ${{ vars.DIFFGUARD_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr_number }}
          comment: ${{ inputs.comment }}
          fail-on: ${{ inputs.fail_on }}
          report-path: diffguard-review.json
          sarif-path: diffguard-results.sarif
      - name: Upload DiffGuard SARIF to code scanning
        if: always() && steps.reviewed_pr.outputs.sarif_supported == 'true' && hashFiles('diffguard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: diffguard-results.sarif
          category: diffguard
          ref: ${{ steps.reviewed_pr.outputs.ref }}
          sha: ${{ steps.reviewed_pr.outputs.sha }}
      - name: Upload structured review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diffguard-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            diffguard-review.json
            diffguard-results.sarif
          if-no-files-found: warn
          retention-days: 30
