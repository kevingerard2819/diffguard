name: Deployment smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL (falls back to the DIFFGUARD_URL repository variable)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify deployed readiness contract
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.url || vars.DIFFGUARD_URL }}
        run: node scripts/smoke-deployment.mjs

